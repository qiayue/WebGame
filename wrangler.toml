name = "webgame-template"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (Tailwind CSS, client JS, favicon, etc.).
[assets]
directory = "./public"
binding = "ASSETS"

# Default JSON content bundled into the Worker — used as the initial seed
# for a fresh R2 bucket. After first request, the runtime reads from R2.
[[rules]]
type = "Text"
globs = ["content/**/*.json"]
fallthrough = true

# ----------------------------------------------------------------------------
# Only ONE binding is required to deploy. Everything else is configured
# at runtime via the /setup wizard.
# ----------------------------------------------------------------------------
#
# Required:
#   R2_UPLOADS — the R2 bucket. Holds:
#     - the runtime config (_config/runtime.json)
#     - the content (content/site.json, content/index.json, content/pages/...)
#     - uploaded cover images (covers/...)
#
# Optional env vars (advanced users only — the wizard is the normal path):
#   ADMIN_PASSWORD         Bootstrap admin password without using the wizard.
#   ADMIN_SESSION_SECRET   Override the auto-generated session-signing secret.
#   R2_UPLOAD_SECRET       Override the auto-generated upload-signing secret.
#   R2_PUBLIC_BASE_URL     R2 bucket's public URL.
# ----------------------------------------------------------------------------

[[r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "webgame-uploads"
